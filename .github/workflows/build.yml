# Builds the plugin on every push and pull request. Pushing a tag like v0.1.0 also publishes a release with the DLL,
# versioned from the tag.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: |
          # A release takes its version from the tag; other builds keep the one in the project file.
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then args+=("-p:Version=${GITHUB_REF_NAME#v}"); fi
          dotnet build src -c Release "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoMuteUsCapture
          path: src/bin/Release/net6.0/AutoMuteUsCapture.dll

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" src/bin/Release/net6.0/AutoMuteUsCapture.dll --generate-notes
